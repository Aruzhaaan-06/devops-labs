name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

  workflow_dispatch:
    inputs:
      tag:
        description: "Бар нұсқа тегі: sha-xxxxxxx немесе x.y.z шығарылымы"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------- CI: әр PR және push үшін құрастыру мен тестілеу ----------
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: demo
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d demo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      Storage: Postgres
      ConnectionStrings__Db: Host=localhost;Port=5432;Database=demo;Username=demo;Password=demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DemoApi.slnx
      - run: dotnet build DemoApi.slnx --no-restore -c Release
      - run: dotnet test DemoApi.slnx --no-build -c Release

  # ---------- Бейнені құрастыру және GHCR-ға жариялау (PR үшін орындалмайды) ----------
  image:
    needs: test
    if: github.event_name == 'push' && github.repository == 'Aruzhaaan-06/devops-labs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- CD: self-hosted runner арқылы Docker Desktop ішіне орналастыру ----------
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Aruzhaaan-06/devops-labs'
    environment: local
    runs-on: [self-hosted, Windows, X64, devops-labs]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: pwsh          # runner орнатылған компьютерге PowerShell 7 қажет
    env:
      API_IMAGE: ${{ needs.image.outputs.image }}
      API_TAG: ${{ needs.image.outputs.tag }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: "15432"
      API_PORT: "8088"
      COMPOSE_SUBNET: "10.254.54.0/24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Бейнені жүктеу
        run: docker compose pull api

      - name: Қолданбаны орналастыру
        run: docker compose up -d --no-build --wait --wait-timeout 90

      - name: Негізгі жұмысқа қабілеттілікті тексеру
        run: docker compose exec -T api curl -fsS http://localhost:8080/health/ready

      - name: Тапсырмалар тізімінің жауап уақытын тексеру
        run: ./scripts/smoke-tasks-latency.ps1 -BaseUrl "http://127.0.0.1:$env:API_PORT"

      - name: Орындалу қорытындысы
        run: |
          $version = (Invoke-RestMethod "http://127.0.0.1:$env:API_PORT/" -TimeoutSec 10).version
          if ($version -ne $env:API_TAG) { throw "Running version differs from requested tag" }
          "Deployed ${env:API_IMAGE}:${env:API_TAG}" >> $env:GITHUB_STEP_SUMMARY
          "Verified version: $version" >> $env:GITHUB_STEP_SUMMARY

  rollback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Aruzhaaan-06/devops-labs'
    environment: local
    runs-on: [self-hosted, Windows, X64, devops-labs]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: pwsh
    env:
      API_IMAGE: ghcr.io/aruzhaaan-06/devops-labs
      API_TAG: ${{ inputs.tag }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: "15432"
      API_PORT: "8088"
      COMPOSE_SUBNET: "10.254.54.0/24"
    steps:
      - name: Нұсқа тегін тексеру
        run: |
          if ($env:API_TAG -notmatch '^(sha-[0-9a-f]{7}|[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Use an existing sha-xxxxxxx or release x.y.z tag; latest is not a rollback target"
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Бұрынғы бейнені жүктеу
        run: docker compose pull api
      - name: Алдыңғы нұсқаға қайтару
        run: docker compose up -d --no-build --wait --wait-timeout 90
      - name: Негізгі жұмысқа қабілеттілікті тексеру
        run: docker compose exec -T api curl -fsS http://localhost:8080/health/ready
      - name: Орындалу қорытындысы
        run: |
          $version = (Invoke-RestMethod "http://127.0.0.1:$env:API_PORT/" -TimeoutSec 10).version
          $imageEnv = docker image inspect "${env:API_IMAGE}:${env:API_TAG}" --format '{{range .Config.Env}}{{println .}}{{end}}'
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect rollback image" }
          $expectedVersion = ($imageEnv | Where-Object { $_ -like 'APP_VERSION=*' }) -replace '^APP_VERSION=', ''
          if (-not $expectedVersion -or $version -ne $expectedVersion) { throw "Running version differs from rollback image" }
          "Rolled back ${env:API_IMAGE}:${env:API_TAG}" >> $env:GITHUB_STEP_SUMMARY
          "Verified version: $version" >> $env:GITHUB_STEP_SUMMARY
