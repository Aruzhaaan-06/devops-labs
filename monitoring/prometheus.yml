global:
  scrape_interval: 5s        # для учебного стенда; в проде обычно 15–30s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: demo-api
    static_configs:
      - targets: ["host.docker.internal:8088"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
